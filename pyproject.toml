[project]
name = "temporal-hyperiv"
version = "1.0.0"
description = "Temporal extensions of HyperIV for implied-volatility surfaces"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "exchange-calendars==4.13.2",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "py7zr==1.1.3",
    "scipy==1.14.1",
    "torch>=2.5",
    "tqdm==4.67.1",
]

[dependency-groups]
dev = ["pytest==8.3.5"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hyperiv", "temporal_hyperiv"]
